name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public values inlined into the client bundle at build time. The build also reads Supabase
      # while prerendering, so these must point at a reachable project.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check build configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set repository variable NEXT_PUBLIC_SUPABASE_URL and secret NEXT_PUBLIC_SUPABASE_ANON_KEY (see DEPLOYMENT.md)"
            exit 1
          fi
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Smoke test on the host's glibc level (AlmaLinux 8, glibc 2.28)
        run: |
          docker run --rm \
            -e NEXT_PUBLIC_SUPABASE_URL -e NEXT_PUBLIC_SUPABASE_ANON_KEY -e NEXT_PUBLIC_SITE_URL \
            -v "$(dirname "$(dirname "$(command -v node)")"):/node:ro" \
            -v "$PWD:/work" -w /work almalinux:8 \
            /node/bin/node scripts/smoke-test.mjs release
      - name: Create release archive
        run: tar -czf pipeflow-release.tgz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: pipeflow-release
          path: pipeflow-release.tgz
          retention-days: 14
          if-no-files-found: error
